spring:
  application:
    name: collector

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: false
        max.in.flight.requests.per.connection: 1
        retries: 3

grpc:
  server:
    port: 59091

server:
  port: 8080