spring:
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:dbuser}
    password: ${ORDER_DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  jackson:
    deserialization:
      fail-on-unknown-properties: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

server:
  port: 0

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
      inventory-service:
        connectTimeout: 3000
        readTimeout: 3000
        loggerLevel: full

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - "feign.FeignException$NotFound"
          - "feign.FeignException$Conflict"
          - "feign.FeignException$BadRequest"
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

logging:
  level:
    ru.yandex.practicum.order.feign.InventoryClient: DEBUG
    ru.yandex.practicum.order.feign.ProductClient: DEBUG